version: "3.8"

services:
  mongodb:
    image: mongo:latest
    container_name: smart-evaluate-db
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smart-evaluate-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/smart-evaluate
      - JWT_SECRET=smart-evaluate-super-secret-key-2026
      - QR_SIGNING_SECRET=qr-secure-expo-signing-key-2026
      - NODE_ENV=production
    depends_on:
      - mongodb

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-evaluate-frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend

volumes:
  mongo-data:
